[project]
name = "python-machine-learning"
version = "0.1.0"
description = "Practical machine learning training notebooks"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4",
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "joblib>=1.4,<2",
    "mlxtend>=0.25.0",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false
